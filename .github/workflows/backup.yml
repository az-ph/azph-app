name: Backup notturno

# Ogni notte (circa alle 3 di Roma): copia del database compressa nel Drive condiviso del titolare.
# Tiene gli ultimi 30 giorni e il primo backup di ogni mese. Il file non resta su GitHub (niente artifact).
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: produzione
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GOOGLE_SA_EMAIL: ${{ secrets.GOOGLE_SA_EMAIL }}
      GOOGLE_SA_PRIVATE_KEY: ${{ secrets.GOOGLE_SA_PRIVATE_KEY }}
      BACKUP_DRIVE_ID: ${{ vars.BACKUP_DRIVE_ID || secrets.BACKUP_DRIVE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Collega il progetto
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Esporta struttura e dati
        run: |
          set -euo pipefail
          umask 077
          f="azph-backup-$(TZ=Europe/Rome date +%F).sql"
          supabase db dump --linked -f /tmp/schema.sql
          supabase db dump --linked --data-only --use-copy -f /tmp/dati.sql
          cat /tmp/schema.sql /tmp/dati.sql | gzip -9 > "/tmp/$f.gz"
          rm /tmp/schema.sql /tmp/dati.sql
          echo "FILE=/tmp/$f.gz" >> "$GITHUB_ENV"
          echo "Backup pronto: $(du -h "/tmp/$f.gz" | cut -f1)"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Carica nel Drive condiviso
        run: npx tsx scripts/backup-drive.ts "$FILE"
